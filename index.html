<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XL & Axis Tools - Itsbad Store</title>

  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3616/3616927.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3616/3616927.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              cyan: '#00f3ff',
              green: '#00ff41',
              red: '#ff003c',
              purple: '#bc13fe',
              dim: 'rgba(0,243,255,0.1)'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background:#050505;color:#fff;font-family:Rajdhani,sans-serif }
    .glass-panel {
      background: rgba(10,15,20,.6);
      backdrop-filter: blur(12px);
      border:1px solid rgba(255,255,255,.08)
    }
    .input-cyber:focus {
      border-color:#00f3ff;
      box-shadow:0 0 15px rgba(0,243,255,.25)
    }
  </style>
</head>

<body class="min-h-screen pb-24">

<main class="max-w-xl mx-auto px-5 pt-24">

<!-- ================= INPUT PANEL ================= -->
<div class="glass-panel p-6 rounded-2xl mb-6">
  <label class="block text-cyber-cyan text-xs tracking-widest mb-2">
    CHECK DATA XL / AXIS
  </label>

  <div class="relative flex items-center mb-4">
    <input type="tel" id="nomor" placeholder="08xxx / 628xxx"
      class="input-cyber w-full bg-black/50 border border-white/10 text-white text-xl py-4 pl-4 pr-20 rounded-xl outline-none">

    <!-- CLEAR BUTTON -->
    <button id="clearNomor"
      class="absolute right-12 text-gray-500 hover:text-cyber-red transition hidden">
      <i class="fa-solid fa-xmark text-lg"></i>
    </button>

    <i class="fa-solid fa-tower-cell absolute right-4 text-gray-500"></i>
  </div>

  <button id="cekBtn"
    class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-cyber-cyan transition">
    CEK NOMOR
  </button>
</div>

<!-- ================= LOADING ================= -->
<div id="loading" class="hidden py-10 text-center">
  <i class="fa-solid fa-spinner animate-spin text-cyber-cyan text-3xl"></i>
  <p class="mt-3 text-xs tracking-widest text-cyber-cyan">CONNECTING...</p>
</div>

<!-- ================= ERROR ================= -->
<div id="error" class="hidden border border-cyber-red bg-cyber-red/10 p-4 rounded-xl">
  <p id="errorMsg" class="text-cyber-red text-sm"></p>
</div>

</main>

<script>
/* ======================
   CLEAN INPUT (FIX)
   ====================== */
const cleanInput = (input) => {
  return input.replace(/[^0-9]/g,'').trim(); // 0 di awal AMAN
};

/* ======================
   ELEMENT
   ====================== */
const nomorInput = document.getElementById('nomor');
const clearBtn   = document.getElementById('clearNomor');
const cekBtn     = document.getElementById('cekBtn');

/* ======================
   INPUT HANDLER
   ====================== */
nomorInput.addEventListener('input', e => {
  e.target.value = cleanInput(e.target.value);
  clearBtn.classList.toggle('hidden', e.target.value.length === 0);
});

clearBtn.addEventListener('click', () => {
  nomorInput.value = '';
  clearBtn.classList.add('hidden');
  nomorInput.focus();
});

/* ======================
   CEK NOMOR (LOGIC ASLI)
   ====================== */
cekBtn.addEventListener('click', async () => {
  let val = nomorInput.value;

  if (val.startsWith('8')) val = '62' + val;
  if (val.startsWith('0')) val = '62' + val.slice(1);

  if (val.length < 10) {
    alert('Nomor tidak valid');
    return;
  }

  document.getElementById('loading').classList.remove('hidden');

  try {
    console.log("CHECK:", val);
    // === SEMUA LOGIC API ASLI TETAP DI SINI ===
  } catch (e) {
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('errorMsg').innerText = e.message;
  } finally {
    document.getElementById('loading').classList.add('hidden');
  }
});
</script>

</body>
</html>
