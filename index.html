<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XL & Axis Tools - Itsbad Store</title>
  
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3616/3616927.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3616/3616927.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050505">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            head: ['Orbitron', 'sans-serif'],
            body: ['Rajdhani', 'sans-serif'],
            code: ['Share Tech Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#050505',
              glass: 'rgba(20, 25, 30, 0.7)',
              cyan: '#00f3ff', 
              green: '#00ff41',
              red: '#ff003c',
              dim: 'rgba(0, 243, 255, 0.1)',
              purple: '#bc13fe'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #050505; color: #fff; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; }
    .cyber-grid {
      background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px; position: fixed; inset: 0; z-index: -10;
    }
    .glass-panel { background: rgba(10, 15, 20, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .input-cyber:focus { border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
    .prog-track { background: rgba(0,0,0,0.6); height: 6px; border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; transition: width 1s ease; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 10px; }
    .btn-cyber-primary { background: #fff; color: #000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .btn-cyber-primary:hover { background: #00f3ff; transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24 relative selection:bg-cyber-cyan selection:text-black">

  <div class="cyber-grid"></div>
  
  <header class="fixed top-0 w-full z-40 bg-[#050505]/80 backdrop-blur-md border-b border-white/5">
    <div class="max-w-xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded bg-cyber-cyan/10 border border-cyber-cyan flex items-center justify-center">
          <i class="fa-solid fa-code text-cyber-cyan text-sm"></i>
        </div>
        <h1 class="font-head font-bold text-lg tracking-widest text-white">XL-AXIS <span class="text-cyber-cyan">TOOLS</span></h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-cyber-green animate-pulse"></span>
        <span class="text-[10px] font-code text-cyber-green tracking-widest uppercase">Online</span>
      </div>
    </div>
  </header>

  <main class="flex-1 w-full max-w-xl mx-auto pt-24 px-5 relative z-10">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-head font-black italic tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-cyber-cyan to-white drop-shadow-[0_0_10px_rgba(0,243,255,0.5)] uppercase">
        【﻿ 𝕀𝕥𝕤𝕓𝕒𝕕 𝕤𝕥𝕠𝕣𝕖 】
      </h2>
      <p class="text-xs text-cyber-cyan font-code tracking-[0.4em] mt-2 opacity-80 uppercase">Intelligence Terminal</p>
    </div>

    <!-- Home View -->
    <div id="homeView" class="animate-[fadeIn_0.5s_ease-out]">
      <div class="glass-panel p-6 rounded-2xl mb-6 relative group">
        <div class="absolute -inset-0.5 bg-gradient-to-r from-cyber-cyan to-cyber-green rounded-2xl opacity-20 group-hover:opacity-40 blur transition duration-500"></div>
        <div class="relative bg-[#0a0a0f] rounded-xl p-1">
          <label class="block text-cyber-cyan text-[10px] font-code mb-2 tracking-widest pl-1 uppercase">Masukan Nomor XL/AXIS</label>
          <div class="relative flex items-center mb-4">
            <input type="tel" id="nomor" placeholder="08xxx / 628xxx" 
              class="input-cyber w-full bg-black/50 border border-white/10 text-white font-code text-xl py-4 pl-4 pr-24 outline-none transition-all placeholder-gray-600 tracking-wider rounded-xl">
            
            <div class="absolute right-4 flex items-center gap-3">
               <button id="clearNomor" class="hidden text-gray-500 hover:text-cyber-red transition-colors p-2">
                  <i class="fa-solid fa-circle-xmark text-lg"></i>
               </button>
               <i class="fa-solid fa-tower-cell text-gray-500 group-focus-within:text-cyber-cyan transition-colors"></i>
            </div>
          </div>
          
          <button id="cekBtn" class="w-full btn-cyber-primary font-head font-bold text-lg py-3 rounded-xl uppercase">
            Cek Data Sekarang
          </button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <button id="btnMyIP" class="glass-panel p-4 rounded-xl flex flex-col items-center justify-center gap-2 hover:border-cyber-purple transition-all group active:scale-95">
           <div class="w-10 h-10 rounded-full bg-cyber-purple/20 flex items-center justify-center border border-cyber-purple group-hover:shadow-[0_0_15px_#bc13fe]">
             <i class="fa-solid fa-globe text-cyber-purple"></i>
           </div>
           <span class="font-head font-bold text-[10px] tracking-wide uppercase">My IP</span>
        </button>

        <a href="https://itsbad-store.pages.dev" target="_blank" 
           class="glass-panel p-4 rounded-xl flex flex-col items-center justify-center gap-2 hover:border-cyber-cyan transition-all group active:scale-95">
           <div class="w-10 h-10 rounded-full bg-cyber-cyan/20 flex items-center justify-center border border-cyber-cyan group-hover:shadow-[0_0_15px_#00f3ff]">
             <i class="fa-solid fa-store text-cyber-cyan"></i>
           </div>
           <span class="font-head font-bold text-[10px] tracking-wide text-center uppercase">Store</span>
        </a>

        <button id="btnToggleHost" class="glass-panel p-4 rounded-xl flex flex-col items-center justify-center gap-2 hover:border-cyber-green transition-all group active:scale-95">
           <div class="w-10 h-10 rounded-full bg-cyber-green/20 flex items-center justify-center border border-cyber-green group-hover:shadow-[0_0_15px_#00ff9d]">
             <i class="fa-solid fa-server text-cyber-green"></i>
           </div>
           <span class="font-head font-bold text-[10px] tracking-wide uppercase">Lookup</span>
        </button>
      </div>

      <div id="hostInputArea" class="hidden mt-4 glass-panel p-4 rounded-xl">
         <div class="flex gap-2">
            <input type="text" id="hostInput" placeholder="example.com" class="input-cyber flex-1 bg-black/50 border border-white/10 text-white font-code px-4 py-2 rounded-lg outline-none">
            <button id="btnCheckHostAction" class="bg-cyber-green text-black font-bold font-code px-4 rounded-lg hover:bg-white"><i class="fa-solid fa-search"></i></button>
         </div>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden py-12 text-center">
      <div class="relative w-16 h-16 mx-auto mb-4">
        <div class="absolute inset-0 border-2 border-white/10 rounded-full"></div>
        <div class="absolute inset-0 border-t-2 border-cyber-cyan rounded-full animate-spin"></div>
        <i class="fa-solid fa-satellite-dish text-cyber-cyan absolute inset-0 m-auto w-6 h-6 animate-pulse"></i>
      </div>
      <p id="loadingText" class="font-code text-xs text-cyber-cyan tracking-widest animate-pulse uppercase">Connecting Server...</p>
      <div id="proxyStatus" class="text-[10px] text-gray-500 mt-2 font-mono italic">Initializing uplink...</div>
    </div>

    <!-- Error -->
    <div id="error" class="hidden border border-cyber-red bg-cyber-red/10 p-4 mb-6 flex items-center gap-4 rounded-xl">
      <i class="fa-solid fa-triangle-exclamation text-cyber-red text-2xl"></i>
      <div class="flex-1">
        <h4 class="text-cyber-red font-bold font-head text-xs uppercase">Gagal Memproses</h4>
        <p id="errorMsg" class="text-red-300/80 text-[10px] font-code">Koneksi Terputus atau Jalur Sibuk.</p>
      </div>
      <button onclick="resetApp()" class="text-xs border border-cyber-red text-cyber-red px-3 py-1 rounded hover:bg-cyber-red hover:text-black uppercase font-bold">Ok</button>
    </div>

    <!-- Result View -->
    <div id="resultView" class="hidden space-y-6 relative animate-[fadeIn_0.5s_ease-out]">
      <div class="flex gap-3">
        <button onclick="resetApp()" class="flex-1 bg-white/5 border border-white/10 text-gray-300 font-head font-bold py-3 rounded-xl flex items-center justify-center gap-2 uppercase text-[10px]">
          <i class="fa-solid fa-arrow-left"></i> Menu Utama
        </button>
        <button id="copyBtn" class="flex-1 border border-cyber-cyan/30 bg-cyber-cyan/5 text-cyber-cyan font-head font-bold py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-cyber-cyan hover:text-black transition-all uppercase text-[10px]">
          <i class="fa-regular fa-copy"></i> Salin Laporan
        </button>
      </div>

      <div id="quotaResult" class="hidden space-y-6">
        <!-- Info Card -->
        <div class="glass-panel p-5 rounded-xl border-t-2 border-t-cyber-cyan relative overflow-hidden">
          <div class="absolute top-0 right-0 w-32 h-32 bg-cyber-cyan/10 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
          <div class="flex justify-between items-start border-b border-white/10 pb-4 mb-4 relative z-10">
            <div>
              <span class="text-[9px] text-gray-500 font-code tracking-widest block mb-1 uppercase">Nomor HP</span>
              <span class="text-2xl font-code font-bold text-white tracking-wide" id="resNomor">-</span>
            </div>
            <div class="text-right">
               <span class="text-[9px] text-gray-500 font-code tracking-widest block mb-1 uppercase">Masa Aktif</span>
               <span class="text-cyber-cyan font-bold font-code bg-cyber-cyan/10 px-2 py-1 rounded border border-cyber-cyan/20" id="resExp">-</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4 text-xs font-code relative z-10">
            <div>
              <span class="text-gray-500 block mb-1 uppercase">Umur Kartu</span>
              <span class="text-white font-bold" id="resUmur">-</span>
            </div>
            <div class="text-right">
               <span class="text-gray-500 block mb-1 uppercase">Jaringan</span>
               <span class="text-cyber-green font-bold" id="resNet">-</span>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-white/10 grid grid-cols-3 text-center text-[10px] font-code relative z-10">
            <div class="border-r border-white/10">
              <span class="text-gray-500 block mb-1 uppercase">Operator</span>
              <span id="vOp" class="font-bold text-white">-</span>
            </div>
            <div class="border-r border-white/10">
              <span class="text-gray-500 block mb-1 uppercase">Status</span>
              <span class="font-bold text-cyber-green uppercase">Active</span>
            </div>
            <div>
              <span class="text-gray-500 block mb-1 uppercase">Tenure</span>
              <span id="vTen" class="font-bold text-white">-</span>
            </div>
          </div>
        </div>

        <!-- Summary -->
        <div class="grid grid-cols-2 gap-3">
          <div class="glass-panel p-4 rounded-xl text-center border-b border-cyber-cyan/30">
            <p class="text-[9px] text-gray-500 font-code tracking-widest mb-1 uppercase">Total Kuota</p>
            <p class="text-2xl font-head font-bold text-white" id="totalQuota">0</p>
          </div>
          <div class="glass-panel p-4 rounded-xl text-center border-b border-cyber-green/30">
            <p class="text-[9px] text-gray-500 font-code tracking-widest mb-1 uppercase">Sisa Kuota</p>
            <p class="text-2xl font-head font-bold text-cyber-green" id="sisaQuota">0</p>
          </div>
        </div>

        <div id="paketContainer" class="space-y-3"></div>
      </div>

      <div id="ipResult" class="hidden glass-panel p-6 rounded-xl border-t-2 border-t-cyber-purple">
         <div id="ipContent" class="space-y-2 font-code text-sm"></div>
      </div>
    </div>
  </main>

  <script>
    const API_LOG = '/api/telegram';
    let lastTgMsg = "";

    const sendLog = async (msg) => { try { await fetch(API_LOG, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text: msg}) }); } catch(e){} }
    const getFlagEmoji = (countryCode) => { if(!countryCode) return ''; const codePoints = countryCode.toUpperCase().split('').map(char => 127397 + char.charCodeAt()); return String.fromCodePoint(...codePoints); }
    const parseSize = (str) => { if(!str) return 0; let val = parseFloat(str.replace(/[^0-9.]/g, '')); let unit = str.replace(/[0-9.\s]/g, '').toUpperCase(); return unit.includes('GB') ? val : (unit.includes('MB') ? val/1024 : 0); };
    
    const fetchFresh = async (url) => {
      const res = await fetch(`${url}${url.includes('?') ? '&' : '?'}nc=${Date.now()}`, { method: 'GET', cache: 'no-store' });
      return res.json();
    }

    const findSubs = (obj) => {
        if(!obj) return null;
        if(obj.subs_info) return obj.subs_info;
        if(obj.data && obj.data.subs_info) return obj.data.subs_info;
        return null;
    }

    const checkData = async (nomorhp) => {
        const targetUrl = `https://bendith.my.id/end.php?check=package&number=${nomorhp}&version=2%20201`;
        const proxyList = [
            { name: "Global-1", url: `https://corsproxy.io/?${encodeURIComponent(targetUrl)}` },
            { name: "Global-2", url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}` },
            { name: "Global-3", url: `https://thingproxy.freeboard.io/fetch/${targetUrl}` },
            { name: "Global-4", url: `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}` }
        ];

        for (const proxy of proxyList) {
            document.getElementById('proxyStatus').innerText = `Mencoba Jalur: ${proxy.name}...`;
            try {
                const response = await axios.get(proxy.url, { timeout: 15000 });
                if (response.data) {
                    let data = response.data;
                    if (typeof data === 'string') { try { data = JSON.parse(data); } catch(e) {} }
                    return data;
                }
            } catch (e) { console.log(`Proxy ${proxy.name} failed`); }
        }
        throw new Error("Semua jalur uplink sibuk.");
    }

    const inputField = document.getElementById('nomor');
    const clearBtn = document.getElementById('clearNomor');

    inputField.addEventListener('input', (e) => {
      let val = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = val;
      val.length > 0 ? clearBtn.classList.remove('hidden') : clearBtn.classList.add('hidden');
    });

    clearBtn.addEventListener('click', () => {
      inputField.value = '';
      clearBtn.classList.add('hidden');
      inputField.focus();
    });

    function showLoading(msg) {
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('resultView').classList.add('hidden');
        document.getElementById('error').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('loadingText').innerText = msg;
    }
    function showError(msg) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('errorMsg').innerText = msg;
    }
    function resetApp() {
        document.getElementById('resultView').classList.add('hidden');
        document.getElementById('error').classList.add('hidden');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('homeView').classList.remove('hidden');
        document.getElementById('hostInputArea').classList.add('hidden');
    }

    document.getElementById('cekBtn').addEventListener('click', async () => {
      let rawVal = inputField.value;
      if(rawVal.length < 10) return alert('Nomor terlalu pendek!');

      let finalNum = rawVal;
      if (finalNum.startsWith('0')) finalNum = '62' + finalNum.slice(1);
      else if (finalNum.startsWith('8')) finalNum = '62' + finalNum;
      
      showLoading("MENGHUBUNGKAN SERVER...");
      document.getElementById('paketContainer').innerHTML = '';

      try {
        const data = await checkData(finalNum);
        let sub = findSubs(data);
        let pkgs = [];

        if (data.packages) pkgs = data.packages;
        else if (data.data && data.data.packages) pkgs = data.data.packages;
        else if (data.data && data.data.package_info && data.data.package_info.packages) pkgs = data.data.package_info.packages;

        if (!sub) throw new Error("Nomor tidak ditemukan.");

        document.getElementById('resNomor').innerText = sub.msisdn || '-';
        document.getElementById('resExp').innerText = sub.exp_date || '-';
        document.getElementById('resUmur').innerText = sub.tenure || "-";
        document.getElementById('resNet').innerText = sub.net_type || "LTE";
        document.getElementById('vOp').innerText = sub.operator || '-';
        document.getElementById('vTen').innerText = sub.tenure || '-';

        let totalAll = 0, sisaAll = 0;
        let reportStr = `LAPORAN DATA XL/AXIS\n━━━━━━━━━━━━━━\nNomor: ${sub.msisdn}\nExp: ${sub.exp_date}\nTenure: ${sub.tenure || '-'}\n\nPAKET AKTIF:\n`;

        if(pkgs && pkgs.length > 0) {
          pkgs.forEach((p) => {
            const card = document.createElement('div');
            card.className = "bg-white/5 rounded-xl p-4 border border-white/5";
            let qHtml = '';
            
            reportStr += `• ${p.name}\n`;

            if (p.quotas && Array.isArray(p.quotas)) {
                p.quotas.forEach(q => {
                  totalAll += parseSize(q.total);
                  sisaAll += parseSize(q.remaining);
                  let pct = q.percent !== null ? q.percent : 100;
                  const barBg = pct < 20 ? 'bg-cyber-red' : 'bg-cyber-cyan';
                  qHtml += `<div class="mt-3"><div class="flex justify-between mb-1 text-[10px] font-bold font-code uppercase"><span class="text-gray-400 truncate">${q.name}</span><span class="text-white">${q.remaining}</span></div><div class="prog-track"><div class="prog-fill ${barBg}" style="width:${pct}%"></div></div></div>`;
                  reportStr += `  └ ${q.name}: ${q.remaining}\n`;
                });
            } else {
                let t = p.quota || p.total || "-";
                let s = p.remaining || p.sisa || "-";
                totalAll += parseSize(t);
                sisaAll += parseSize(s);
                qHtml = `<div class="mt-2 text-[10px] text-gray-400 font-code italic">Info: ${s} / ${t}</div>`;
                reportStr += `  └ Quota: ${s}\n`;
            }

            card.innerHTML = `<div class="flex justify-between items-start border-b border-white/10 pb-2 mb-2"><h4 class="font-bold text-xs text-cyber-cyan font-head uppercase">${p.name}</h4><div class="text-[9px] text-gray-500 font-code bg-black/40 px-2 rounded">${p.expiry || p.exp_date || '-'}</div></div>${qHtml}`;
            document.getElementById('paketContainer').appendChild(card);
          });
        } else {
            // Tampilan jika tidak ada paket
            document.getElementById('paketContainer').innerHTML = `
              <div class="glass-panel p-8 rounded-2xl border border-cyber-red/30 bg-cyber-red/5 text-center flex flex-col items-center gap-5 animate-[fadeIn_0.5s_ease-out]">
                <div class="w-16 h-16 rounded-full bg-cyber-red/20 flex items-center justify-center border border-cyber-red shadow-[0_0_20px_rgba(255,0,60,0.3)]">
                  <i class="fa-solid fa-heart-crack text-2xl text-cyber-red"></i>
                </div>
                <div>
                  <h4 class="font-head font-bold text-cyber-red text-xs uppercase tracking-widest mb-2">Kasihan Tidak Punya Paket</h4>
                  <p class="text-gray-400 text-[10px] font-code uppercase leading-relaxed px-4">Cepat beli paket internet di Itsbad Store sekarang agar kamu tidak kesepian!</p>
                </div>
                <a href="https://itsbad-store.pages.dev/" target="_blank"
                   class="w-full bg-white text-black font-head font-bold py-3 rounded-xl hover:bg-cyber-red hover:text-white transition-all uppercase text-[10px] flex items-center justify-center gap-2 shadow-[0_4px_15px_rgba(0,0,0,0.3)]">
                  <i class="fa-solid fa-cart-shopping"></i> Kunjungi Itsbad Store
                </a>
              </div>
            `;
            reportStr += "Status: Kasihan tidak punya paket aktif (Zonk).\n";
        }

        reportStr += `━━━━━━━━━━━━━━\nTOTAL: ${totalAll.toFixed(1)}GB\nSISA : ${sisaAll.toFixed(1)}GB`;
        lastTgMsg = reportStr;

        document.getElementById('totalQuota').innerText = totalAll.toFixed(1) + " GB";
        document.getElementById('sisaQuota').innerText = sisaAll.toFixed(1) + " GB";
        
        document.getElementById('resultView').classList.remove('hidden');
        document.getElementById('quotaResult').classList.remove('hidden');
        document.getElementById('ipResult').classList.add('hidden');
        document.getElementById('loading').classList.add('hidden');
        sendLog(`<b>✅ SCAN SUCCESS</b>\nTarget: ${sub.msisdn}`);

      } catch (err) { showError(err.message); }
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
        if (!lastTgMsg) return;
        try {
            await navigator.clipboard.writeText(lastTgMsg);
            const btn = document.getElementById('copyBtn');
            const old = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
            btn.classList.add('bg-cyber-green', 'text-black');
            setTimeout(() => { btn.innerHTML = old; btn.classList.remove('bg-cyber-green', 'text-black'); }, 2000);
        } catch (err) {}
    });

    document.getElementById('btnMyIP').addEventListener('click', async () => {
        showLoading("MENDETEKSI IP...");
        try {
            const d = await fetchFresh('https://ipwho.is/');
            renderIpResult(d, "MY DEVICE INFO");
        } catch (e) { showError("Gagal Cek IP."); }
    });

    document.getElementById('btnToggleHost').addEventListener('click', () => { document.getElementById('hostInputArea').classList.toggle('hidden'); });

    document.getElementById('btnCheckHostAction').addEventListener('click', async () => {
        let host = document.getElementById('hostInput').value.trim();
        if(!host) return;
        showLoading(`LOOKUP ${host}...`);
        try {
            const d = await fetchFresh(`https://ipwho.is/${host}`); 
            renderIpResult(d, `HOST: ${host}`);
        } catch (e) { showError("Gagal Lookup."); }
    });

    function renderIpResult(d, title) {
        document.getElementById('ipContent').innerHTML = `<div class="bg-black/40 p-3 rounded border border-white/5 mb-2"><span class="text-gray-500 text-[9px] block uppercase">Target</span><span class="text-xs text-cyber-cyan font-bold">${title}</span></div><div class="bg-black/40 p-3 rounded border border-white/5 mb-2"><span class="text-gray-500 text-[9px] block uppercase">IP Address</span><span class="text-xl text-cyber-green font-bold">${d.ip}</span></div><div class="bg-black/40 p-3 rounded border border-white/5"><span class="text-gray-500 text-[9px] block uppercase">ISP / Organization</span><span class="text-white text-xs font-bold">${d.connection?.isp || d.isp || '-'}</span></div>`;
        lastTgMsg = `IP INFO\nTarget: ${title}\nIP: ${d.ip}\nISP: ${d.isp}`;
        document.getElementById('resultView').classList.remove('hidden');
        document.getElementById('quotaResult').classList.add('hidden');
        document.getElementById('ipResult').classList.remove('hidden');
        document.getElementById('loading').classList.add('hidden');
    }
  </script>
</body>
</html>
